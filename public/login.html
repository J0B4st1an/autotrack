<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoTrack | Inicio de Sesión</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-900 text-slate-100 antialiased justify-between">

  <!-- Header Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
          <i class="fa-solid fa-car-side text-lg"></i>
        </div>
        <div>
          <span class="text-xl font-black tracking-tight text-white">AutoTrack</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Formulario de Login Único Unificado -->
  <main class="flex-1 flex items-center justify-center p-4 py-6 sm:py-10">
    <div class="max-w-sm w-full bg-white rounded-3xl p-6 text-slate-800 shadow-2xl border border-slate-100 relative">
      
      <div class="text-center mb-5">
        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl">
          <i class="fa-solid fa-user-lock"></i>
        </div>
        <h2 class="text-xl font-black text-slate-900">Iniciar Sesión</h2>
        <p class="text-[11px] text-slate-500 mt-1">Ingresa con tus credenciales asignadas.</p>
      </div>

      <!-- Error Alert -->
      <div id="login-error" class="hidden mb-3 p-2.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-medium text-center">
        <!-- Error text -->
      </div>

      <!-- Unified Form -->
      <form id="login-form" onsubmit="handleUnifiedLogin(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Usuario / Correo Electrónico</label>
          <div class="relative">
            <input type="text" id="username-input" required placeholder="Ej. carlos.mendoza o admin" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-500">
            <i class="fa-solid fa-user absolute left-3 top-2.5 text-slate-400 text-xs"></i>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Contraseña</label>
          <div class="relative">
            <input type="password" id="password-input" required placeholder="••••••••" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-500">
            <i class="fa-solid fa-key absolute left-3 top-2.5 text-slate-400 text-xs"></i>
          </div>
        </div>

        <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-2 mt-2">
          <span>Ingresar a la Plataforma</span>
          <i class="fa-solid fa-right-to-bracket"></i>
        </button>
      </form>

      <div class="mt-4 text-center text-[10px] text-slate-400 border-t border-slate-100 pt-3">
        <p>Accesos gestionados por el departamento comercial.</p>
      </div>

    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-800">
    <p>© 2024 AutoTrack - Plataforma para Entrega de Vehículos Nuevos.</p>
  </footer>

  <script>
    async function handleUnifiedLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value;
      const errorBox = document.getElementById('login-error');

      errorBox.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!data.success) {
          errorBox.textContent = data.message || "Credenciales incorrectas.";
          errorBox.classList.remove('hidden');
          return;
        }

        const user = data.user;

        // REDIRECCIÓN AUTOMÁTICA SEGÚN EL ROL
        if (user.role === 'client') {
          localStorage.setItem('autotrack_user', JSON.stringify(user));
          localStorage.removeItem('autotrack_admin_user');
          window.location.href = '/index.html';
        } else {
          // Staff / Admin / Asesor / Logística / Trámites
          localStorage.setItem('autotrack_admin_user', JSON.stringify(user));
          localStorage.removeItem('autotrack_user');
          window.location.href = '/admin.html';
        }

      } catch (err) {
        console.error("Error en login:", err);
        errorBox.textContent = "Error de conexión con el servidor.";
        errorBox.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
