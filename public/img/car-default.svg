<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgCar)" rx="24"/>
  <!-- Grid accents -->
  <path d="M0 270 Q300 260 600 270" stroke="#334155" stroke-width="2" fill="none"/>
  <circle cx="300" cy="170" r="140" fill="#2563eb" opacity="0.08"/>
  
  <!-- Shadow -->
  <ellipse cx="300" cy="275" rx="220" ry="16" fill="#000000" opacity="0.45"/>

  <!-- Car Chassis -->
  <g transform="translate(40, 40)">
    <!-- Main Body Profile -->
    <path d="M 60 170 Q 75 140 120 135 L 180 130 L 230 85 Q 260 70 340 70 L 400 70 Q 430 85 450 125 L 485 135 Q 505 145 505 175 L 500 195 Q 490 205 450 205 L 420 205 Q 410 160 360 160 Q 310 160 300 205 L 200 205 Q 190 160 140 160 Q 90 160 80 205 L 50 205 Q 45 190 60 170 Z" fill="url(#carBody)"/>

    <!-- Roof / Windows -->
    <path d="M 235 90 L 325 90 L 325 130 L 195 130 Z" fill="url(#glass)"/>
    <path d="M 335 90 L 390 90 Q 415 105 435 130 L 335 130 Z" fill="url(#glass)"/>

    <!-- Headlight & Taillight -->
    <path d="M 485 145 L 502 152 L 488 160 Z" fill="#fef08a" opacity="0.9"/>
    <path d="M 52 165 L 62 162 L 58 178 Z" fill="#ef4444"/>

    <!-- Left Wheel -->
    <g transform="translate(140, 205)">
      <circle cx="0" cy="0" r="38" fill="#0f172a"/>
      <circle cx="0" cy="0" r="28" fill="#334155"/>
      <circle cx="0" cy="0" r="24" fill="#64748b"/>
      <circle cx="0" cy="0" r="10" fill="#94a3b8"/>
      <!-- Spokes -->
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#cbd5e1" stroke-width="3"/>
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#cbd5e1" stroke-width="3"/>
    </g>

    <!-- Right Wheel -->
    <g transform="translate(360, 205)">
      <circle cx="0" cy="0" r="38" fill="#0f172a"/>
      <circle cx="0" cy="0" r="28" fill="#334155"/>
      <circle cx="0" cy="0" r="24" fill="#64748b"/>
      <circle cx="0" cy="0" r="10" fill="#94a3b8"/>
      <!-- Spokes -->
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#cbd5e1" stroke-width="3"/>
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#cbd5e1" stroke-width="3"/>
    </g>

    <!-- Door Line & Handle -->
    <path d="M 270 130 L 270 195" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="280" y="140" width="18" height="4" rx="2" fill="#93c5fd"/>
  </g>

  <!-- Watermark badge -->
  <text x="300" y="315" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#64748b" letter-spacing="1">VEHÍCULO NUEVO • ALMOTORES</text>
</svg>
