<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSuv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="suvBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="glassSuv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgSuv)" rx="24"/>
  <circle cx="300" cy="170" r="140" fill="#6366f1" opacity="0.08"/>
  <ellipse cx="300" cy="280" rx="230" ry="16" fill="#000000" opacity="0.45"/>

  <!-- SUV Chassis -->
  <g transform="translate(30, 30)">
    <!-- Roof Rails -->
    <path d="M 180 50 L 380 50" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 210 50 L 210 60 M 350 50 L 350 60" stroke="#94a3b8" stroke-width="4"/>

    <!-- Main SUV Body -->
    <path d="M 50 170 Q 60 120 110 110 L 170 105 L 200 60 Q 230 55 380 55 L 430 55 Q 460 70 480 115 L 510 125 Q 525 135 525 175 L 520 200 Q 510 210 470 210 L 440 210 Q 430 155 370 155 Q 310 155 300 210 L 190 210 Q 180 155 120 155 Q 60 155 50 210 L 40 210 Q 35 190 50 170 Z" fill="url(#suvBody)"/>

    <!-- SUV Windows -->
    <path d="M 205 68 L 300 68 L 300 105 L 175 105 Z" fill="url(#glassSuv)"/>
    <path d="M 310 68 L 390 68 L 390 105 L 310 105 Z" fill="url(#glassSuv)"/>
    <path d="M 400 68 L 425 68 Q 450 85 465 105 L 400 105 Z" fill="url(#glassSuv)"/>

    <!-- Lights -->
    <path d="M 505 135 L 522 142 L 508 150 Z" fill="#fef08a" opacity="0.9"/>
    <path d="M 42 155 L 52 152 L 48 168 Z" fill="#ef4444"/>

    <!-- Left Wheel (Large SUV) -->
    <g transform="translate(120, 210)">
      <circle cx="0" cy="0" r="42" fill="#0f172a"/>
      <circle cx="0" cy="0" r="30" fill="#334155"/>
      <circle cx="0" cy="0" r="26" fill="#64748b"/>
      <circle cx="0" cy="0" r="12" fill="#cbd5e1"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#f1f5f9" stroke-width="3"/>
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#f1f5f9" stroke-width="3"/>
    </g>

    <!-- Right Wheel -->
    <g transform="translate(370, 210)">
      <circle cx="0" cy="0" r="42" fill="#0f172a"/>
      <circle cx="0" cy="0" r="30" fill="#334155"/>
      <circle cx="0" cy="0" r="26" fill="#64748b"/>
      <circle cx="0" cy="0" r="12" fill="#cbd5e1"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#f1f5f9" stroke-width="3"/>
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#f1f5f9" stroke-width="3"/>
    </g>
  </g>
  <text x="300" y="315" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#64748b" letter-spacing="1">CAMIONETA / SUV • ALMOTORES</text>
</svg>
